name: inkvault_reader
description: >-
  Lector con anotaciones para stylus en tablet Android (TCL NXTPAPER).
  PDF, ePub y cómics CBZ/CBR en una sola biblioteca, con exportación
  100% local a un vault de Obsidian.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  pdfx: ^2.11.0
  epub_view: ^3.3.0
  archive: ^3.6.1
  image: ^3.3.0
  photo_view: ^0.15.0
  file_picker: ^12.0.0
  path_provider: ^2.1.6
  xml: ^6.5.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
